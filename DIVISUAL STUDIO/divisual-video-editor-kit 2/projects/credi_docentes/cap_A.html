<style>
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{background:transparent!important;width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif}

 .stage{position:absolute;left:50%;top:1170px;transform:translateX(-50%);width:92%;height:0}
 .chunk{position:absolute;left:50%;top:0;transform:translateX(-50%);max-width:840px;text-align:center;padding:24px 40px;border-radius:26px;

 .w{display:inline-block;margin:2px 0.12em;font-family:'Poppins',sans-serif;font-weight:700;font-size:52px;line-height:1.32;
   color:#7a7a82;text-shadow:0 2px 10px rgba(0,0,0,0.5);transform-origin:center}
 .kw{display:inline-block;margin:2px 0.12em;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:60px;
   line-height:1.25;letter-spacing:1px;vertical-align:-2px;opacity:0.35;transform-origin:center;
   background:linear-gradient(180deg,#FFF6C8 0%,#FBD24E 40%,#F5A623 75%,#E08600 100%);
   -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
   -webkit-text-stroke:1px rgba(120,70,0,0.25);
   filter:drop-shadow(0 0 16px rgba(250,197,28,0.6)) drop-shadow(0 2px 2px rgba(0,0,0,0.45))}
