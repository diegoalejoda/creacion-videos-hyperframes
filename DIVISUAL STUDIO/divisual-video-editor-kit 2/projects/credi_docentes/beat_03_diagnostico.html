<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{background:transparent!important;width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff}
 .stage{position:absolute;left:50%;top:1200px;transform:translate(-50%,-50%);width:80%}
 .panel{padding:30px 34px 32px;border-radius:28px;
   background:rgba(13,15,20,0.50);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
   border:1.5px solid rgba(255,90,90,0.22);box-shadow:0 22px 64px rgba(0,0,0,0.55);opacity:0}
 .eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:700;
   font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#FF6B6B;margin-bottom:20px}
 .eyebrow .dot{width:11px;height:11px;border-radius:50%;background:#FF6B6B;box-shadow:0 0 14px #FF6B6B}
 .bar{margin:12px 0;opacity:0}
 .bar .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
 .bar .lbl{font-weight:600;font-size:27px;color:#EDEDED}
 .bar .val{font-family:'Anton',sans-serif;font-size:30px;color:#FF7A5A}
 .track{height:14px;border-radius:7px;background:rgba(255,255,255,0.10);overflow:hidden}
 .fill{height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#FF8A4C,#FF5A5A)}
</style></head><body>
 <div class="stage"><div class="panel" id="panel">
  <div class="eyebrow"><span class="dot"></span>¿A dónde va tu nómina?</div>
  <div class="bar" id="b1"><div class="row"><span class="lbl">Descuentos</span><span class="val" data-v="35">0%</span></div><div class="track"><div class="fill" data-w="35"></div></div></div>
  <div class="bar" id="b2"><div class="row"><span class="lbl">Cooperativas</span><span class="val" data-v="18">0%</span></div><div class="track"><div class="fill" data-w="18"></div></div></div>
  <div class="bar" id="b3"><div class="row"><span class="lbl">Embargos</span><span class="val" data-v="15">0%</span></div><div class="track"><div class="fill" data-w="15"></div></div></div>
  <div class="bar" id="b4"><div class="row"><span class="lbl">Tarjetas en mora</span><span class="val" data-v="12">0%</span></div><div class="track"><div class="fill" data-w="12"></div></div></div>
  <div class="bar" id="b5"><div class="row"><span class="lbl">Deudas por fuera</span><span class="val" data-v="8">0%</span></div><div class="track"><div class="fill" data-w="8"></div></div></div>
 </div></div>
<script>
 const tl=gsap.timeline({paused:true});
 tl.fromTo('#panel',{opacity:0,y:50,scale:0.97},{opacity:1,y:0,scale:1,duration:0.38,ease:'power3.out'},0.10);
 function bar(id,t){const b=document.querySelector(id),fl=b.querySelector('.fill'),vl=b.querySelector('.val'),w=+fl.dataset.w,o={v:0};
  tl.fromTo(b,{opacity:0,x:-22},{opacity:1,x:0,duration:0.28,ease:'power2.out'},t);
  tl.to(fl,{width:w+'%',duration:0.5,ease:'power2.out'},t);
  tl.to(o,{v:w,duration:0.5,ease:'power2.out',onUpdate:()=>vl.textContent=Math.round(o.v)+'%'},t);}
 bar('#b1',1.04);bar('#b2',1.78);bar('#b3',2.88);bar('#b4',3.58);bar('#b5',5.60);
 tl.to('.stage',{opacity:0,y:-26,duration:0.45,ease:'power2.in'},6.6);
 window.__timelines={main:tl};tl.play();
</script></body></html>
