<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beat 06 — CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent !important; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
  .wrap { position: absolute; left: 50%; transform: translateX(-50%); top: 1090px; width: 94%; text-align: center; }
  .card {
    padding: 44px 44px 50px;
    background: rgba(13,13,13,0.70);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 2px solid rgba(37,211,102,0.40); border-radius: 38px;
    box-shadow: 0 30px 100px rgba(0,0,0,0.7), 0 0 80px rgba(37,211,102,0.16);
    opacity: 0;
  }
  .wa { display: inline-flex; align-items: center; gap: 16px; opacity: 0; }
  .wa svg { width: 58px; height: 58px; }
  .wa span { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 34px; letter-spacing: 3px; color: #25D366; text-transform: uppercase; }
  .lead { margin-top: 22px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 42px; color: #fff; opacity: 0; }
  .keyword {
    margin: 18px auto 0; display: inline-block;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 132px;
    line-height: 1; letter-spacing: -3px; color: #0D0D0D;
    background: #FAC51C; padding: 14px 50px 22px; border-radius: 26px;
    box-shadow: 0 0 70px rgba(250,197,28,0.5); opacity: 0;
  }
  .foot { margin-top: 26px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 40px; color: #25D366; opacity: 0; }
  .burst { position: absolute; left: 50%; top: 360px; width: 0; height: 0; pointer-events: none; }
  .bc {
    position: absolute; width: 56px; height: 56px; margin: -28px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFE89A 0%, #FAC51C 45%, #C9930A 100%);
    border: 3px solid #FFD84D; box-shadow: 0 0 18px rgba(250,197,28,0.7);
    display:flex; align-items:center; justify-content:center;
    font-family:'Georgia',serif; font-weight:700; color:#7a5400; font-size:30px; opacity: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="wa" id="wa">
        <svg viewBox="0 0 32 32" fill="#25D366" xmlns="http://www.w3.org/2000/svg"><path d="M16 .4C7.4.4.5 7.3.5 15.9c0 2.8.7 5.4 2 7.8L.4 31.6l8.1-2.1c2.3 1.3 4.9 1.9 7.5 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.4 16 .4zm0 28.3c-2.4 0-4.7-.6-6.7-1.8l-.5-.3-4.8 1.3 1.3-4.7-.3-.5c-1.3-2.1-2-4.5-2-7 0-7.2 5.8-13 13-13s13 5.8 13 13-5.8 13-13 13zm7.1-9.7c-.4-.2-2.3-1.1-2.6-1.3-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3.1-1.9-1.1-1-1.9-2.3-2.1-2.6-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7-.1-.2-.9-2.1-1.2-2.9-.3-.8-.6-.7-.9-.7h-.7c-.3 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1s1.3 3.6 1.5 3.9c.2.3 2.6 4 6.3 5.6.9.4 1.6.6 2.1.8.9.3 1.7.2 2.3.1.7-.1 2.3-.9 2.6-1.9.3-.9.3-1.7.2-1.9-.1-.1-.3-.2-.7-.4z"/></svg>
        <span>Escríbenos por WhatsApp</span>
      </div>
      <div class="lead" id="lead">Envía la palabra</div>
      <div class="keyword" id="kw">CRÉDITO</div>
      <div class="foot" id="foot">→ Atención inmediata</div>
      <div class="burst" id="burst">
        <div class="bc">$</div><div class="bc">$</div><div class="bc">$</div><div class="bc">$</div>
        <div class="bc">$</div><div class="bc">$</div><div class="bc">$</div><div class="bc">$</div>
        <div class="bc">$</div><div class="bc">$</div><div class="bc">$</div><div class="bc">$</div>
      </div>
    </div>
  </div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#card', { opacity:0, y:70 }, { opacity:1, y:0, duration:0.36, ease:'power3.out' }, 0.10);
  tl.fromTo('#wa', { opacity:0, y:18 }, { opacity:1, y:0, duration:0.30, ease:'power2.out' }, 0.84);
  tl.fromTo('#lead', { opacity:0, y:14 }, { opacity:1, y:0, duration:0.26, ease:'power2.out' }, 1.60);
  tl.fromTo('#kw', { opacity:0, scale:0.55 }, { opacity:1, scale:1, duration:0.48, ease:'back.out(2.6)' }, 2.60);
  // explosión de monedas al aparecer la palabra clave
  const coins = gsap.utils.toArray('#burst .bc');
  coins.forEach((c,i)=>{
    const ang = (i/coins.length)*Math.PI*2 + 0.3;
    const dist = 230 + (i%3)*70;
    tl.fromTo(c, { x:0, y:0, scale:0.3, opacity:1 },
      { x:Math.cos(ang)*dist, y:Math.sin(ang)*dist - 40, scale:1, rotation:(i%2?1:-1)*240, duration:0.9, ease:'power2.out' }, 2.62);
    tl.to(c, { opacity:0, y:'+=120', duration:0.5, ease:'power1.in' }, 3.15);
  });
  tl.to('#kw', { boxShadow:'0 0 110px rgba(250,197,28,0.85)', duration:0.5, yoyo:true, repeat:1, ease:'sine.inOut' }, 3.15);
  tl.fromTo('#foot', { opacity:0, y:14 }, { opacity:1, y:0, duration:0.30, ease:'power2.out' }, 4.28);
  window.__timelines = { main: tl };
  tl.play();
</script>
</body>
</html>
