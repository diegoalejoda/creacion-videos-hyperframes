<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beat 04 — Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent !important; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
  .wrap { position: absolute; left: 50%; transform: translateX(-50%); top: 1130px; width: 92%; }
  .card {
    padding: 38px 42px 42px;
    background: rgba(13,13,13,0.64);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 2px solid rgba(250,197,28,0.30); border-radius: 34px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.65), 0 0 70px rgba(250,197,28,0.10);
    opacity: 0;
  }
  .title {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 32px;
    letter-spacing: 4px; color: #FAC51C; text-transform: uppercase; margin-bottom: 28px; text-align: center;
  }
  .item { display: flex; align-items: center; gap: 22px; margin: 18px 0; opacity: 0; }
  .tick {
    flex: 0 0 auto; width: 64px; height: 64px; border-radius: 16px;
    background: rgba(250,197,28,0.14); border: 2px solid #FAC51C;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; color: #FAC51C; font-weight: 700;
  }
  .txt { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 42px; color: #fff; line-height: 1.1; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="title">✦ El primer paso es revisar</div>
      <div class="item" id="i1"><div class="tick">✓</div><div class="txt">Tu nómina y descuentos</div></div>
      <div class="item" id="i2"><div class="tick">✓</div><div class="txt">Qué deudas se pueden negociar</div></div>
      <div class="item" id="i3"><div class="tick">✓</div><div class="txt">Qué te quita más capacidad</div></div>
    </div>
  </div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#card', { opacity:0, y:60 }, { opacity:1, y:0, duration:0.34, ease:'power3.out' }, 0.10);
  const rev = (sel,t)=>tl.fromTo(sel,{opacity:0,x:-26},{opacity:1,x:0,duration:0.30,ease:'power2.out'},t);
  rev('#i1', 0.40);
  rev('#i2', 1.34);
  rev('#i3', 3.58);
  tl.to('.wrap', { opacity:0, y:-30, duration:0.45, ease:'power2.in' }, 6.10);
  window.__timelines = { main: tl };
  tl.play();
</script>
</body>
</html>
