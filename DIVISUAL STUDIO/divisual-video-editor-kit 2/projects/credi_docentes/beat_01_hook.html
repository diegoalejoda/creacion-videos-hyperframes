<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{background:transparent!important;width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff}
 .stage{position:absolute;left:50%;top:1120px;transform:translate(-50%,-50%);width:74%;text-align:center}
 .eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:'Poppins',sans-serif;font-weight:700;
   font-size:26px;letter-spacing:4px;text-transform:uppercase;color:#0D0D0D;background:#FAC51C;
   padding:10px 24px;border-radius:999px;box-shadow:0 10px 28px rgba(250,197,28,0.4);opacity:0}
 .panel{margin-top:20px;padding:34px 38px 38px;border-radius:28px;
   background:rgba(13,15,20,0.46);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
   border:1.5px solid rgba(255,255,255,0.12);box-shadow:0 22px 64px rgba(0,0,0,0.5);opacity:0}
 h1{font-family:'Poppins',sans-serif;font-weight:800;font-size:62px;line-height:1.04;letter-spacing:-1px}
 .gold{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:1px;font-size:78px;
   background:linear-gradient(180deg,#FFF6C8,#FBD24E 45%,#F5A623 78%,#E08600);-webkit-background-clip:text;background-clip:text;
   -webkit-text-fill-color:transparent;-webkit-text-stroke:1px rgba(120,70,0,0.22);
   filter:drop-shadow(0 0 16px rgba(250,197,28,0.6)) drop-shadow(0 2px 2px rgba(0,0,0,0.4));display:inline-block}
 .sub{margin-top:18px;font-weight:600;font-size:34px;line-height:1.3;color:#EDEDED;opacity:0}
 .sub b{color:#FAC51C;font-weight:700}
 .ic{width:26px;height:26px}
</style></head><body>
 <div class="stage">
  <span class="eyebrow" id="eyebrow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>ESTO TE INTERESA</span>
  <div class="panel" id="panel">
   <h1>¿Eres <span class="gold" id="gold">DOCENTE</span><br>del gobierno?</h1>
   <div class="sub" id="sub">Ganas bien… pero las <b>deudas y descuentos</b> no te dejan en paz.</div>
  </div>
 </div>
<script>
 const tl=gsap.timeline({paused:true});
 tl.fromTo('#eyebrow',{opacity:0,y:28,scale:0.9},{opacity:1,y:0,scale:1,duration:0.34,ease:'back.out(2)'},0.10);
 tl.fromTo('#panel',{opacity:0,y:50,scale:0.96},{opacity:1,y:0,scale:1,duration:0.38,ease:'power3.out'},0.30);
 tl.fromTo('#gold',{opacity:0,scale:1.4,filter:'brightness(2)'},{opacity:1,scale:1,filter:'brightness(1)',duration:0.4,ease:'back.out(2.2)'},0.75);
 tl.fromTo('#sub',{opacity:0,y:18},{opacity:1,y:0,duration:0.3,ease:'power2.out'},1.05);
 tl.to('.stage',{opacity:0,y:-26,duration:0.42,ease:'power2.in'},5.10);
 window.__timelines={main:tl};tl.play();
</script></body></html>
