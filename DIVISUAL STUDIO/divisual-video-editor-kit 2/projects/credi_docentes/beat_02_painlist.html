<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beat 02 — Pain list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent !important; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
  .wrap { position: absolute; left: 50%; transform: translateX(-50%); top: 1140px; width: 92%; text-align: center; }
  .card {
    padding: 38px 40px 44px;
    background: rgba(13,13,13,0.64);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 2px solid rgba(255,90,90,0.30); border-radius: 34px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.65), 0 0 70px rgba(255,80,80,0.10);
    opacity: 0;
  }
  .title {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 32px;
    letter-spacing: 4px; color: #FF6B6B; text-transform: uppercase; margin-bottom: 30px;
  }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 16px; }
  .chip {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 40px;
    color: #fff; background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.16); border-radius: 18px;
    padding: 16px 28px; opacity: 0; white-space: nowrap;
  }
  .chip.hot { border-color: rgba(255,90,90,0.55); color: #FFD7D7; background: rgba(255,80,80,0.10); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="title">▾ Cuando llega la nómina…</div>
      <div class="chips">
        <span class="chip" id="c1">Descuentos</span>
        <span class="chip" id="c2">Cooperativas</span>
        <span class="chip hot" id="c3">Embargos</span>
        <span class="chip hot" id="c4">Tarjetas en mora</span>
        <span class="chip hot" id="c5">Deudas por fuera</span>
      </div>
    </div>
  </div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#card', { opacity:0, y:60 }, { opacity:1, y:0, duration:0.34, ease:'power3.out' }, 0.10);
  const pop = (sel,t)=>tl.fromTo(sel,{opacity:0,scale:0.6,y:14},{opacity:1,scale:1,y:0,duration:0.36,ease:'back.out(2.2)'},t);
  pop('#c1', 1.14);
  pop('#c2', 1.88);
  pop('#c3', 2.98);
  pop('#c4', 3.68);
  pop('#c5', 5.70);
  tl.to('.wrap', { opacity:0, y:-30, duration:0.45, ease:'power2.in' }, 6.55);
  window.__timelines = { main: tl };
  tl.play();
</script>
</body>
</html>
