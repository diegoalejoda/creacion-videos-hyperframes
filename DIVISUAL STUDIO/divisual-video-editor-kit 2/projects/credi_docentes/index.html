<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beat 01 — Hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent !important; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
  .wrap { position: absolute; left: 50%; transform: translateX(-50%); top: 1180px; width: 92%; text-align: center; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 30px;
    letter-spacing: 6px; color: #0D0D0D; background: #FAC51C;
    padding: 12px 26px; border-radius: 999px; text-transform: uppercase;
    box-shadow: 0 10px 30px rgba(250,197,28,0.35); opacity: 0;
  }
  .card {
    margin-top: 26px; padding: 40px 46px 44px;
    background: rgba(13,13,13,0.62);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 2px solid rgba(250,197,28,0.30); border-radius: 34px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.65), 0 0 70px rgba(250,197,28,0.10);
    opacity: 0;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 86px;
    line-height: 0.98; letter-spacing: -2px; color: #fff;
  }
  h1 .em { color: #FAC51C; text-shadow: 0 0 40px rgba(250,197,28,0.45); }
  .sub {
    margin-top: 24px; font-family: 'Inter', sans-serif; font-weight: 500;
    font-size: 38px; line-height: 1.3; color: #EDEDED; opacity: 0;
  }
  .sub b { color: #FAC51C; font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow" id="eyebrow">★ ESTO TE INTERESA</span>
    <div class="card" id="card">
      <h1>¿Eres <span class="em">DOCENTE</span><br>del gobierno?</h1>
      <div class="sub" id="sub">Ganas bien… pero las <b>deudas y descuentos</b> no te dejan en paz.</div>
    </div>
  </div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#eyebrow', { opacity:0, y:30, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.34, ease:'back.out(2)' }, 0.10);
  tl.fromTo('#card', { opacity:0, y:60 }, { opacity:1, y:0, duration:0.34, ease:'power3.out' }, 0.28);
  tl.fromTo('#sub', { opacity:0, y:20 }, { opacity:1, y:0, duration:0.32, ease:'power2.out' }, 1.05);
  tl.to('.wrap', { opacity:0, y:-30, duration:0.45, ease:'power2.in' }, 5.10);
  window.__timelines = { main: tl };
  tl.play();
</script>
</body>
</html>
